            chatHistory.push({role:'bot',content:resp});navigate('chatbot');setTimeout(()=>{const el=document.getElementById('chatMessages');if(el)el.scrollTop=el.scrollHeight},100)}
        function preguntarBot(tema){chatHistory=[];enviarMensaje(tema);navigate('chatbot')}
        function cambiarEscenarioForecast(esc){toast('info','Escenario','Cambiando a escenario '+esc+'...');setTimeout(()=>toast('success','Actualizado','Forecast recalculado con escenario '+esc),1000)}
        function selectScenario(esc){document.querySelectorAll('.scenario-card').forEach(c=>c.classList.remove('selected'));event.target.closest('.scenario-card').classList.add('selected');toast('info','Escenario','Seleccionado escenario '+esc)}
        function guardarSupuestos(){toast('success','Guardado','Supuestos actualizados. Recalculando forecast...');setTimeout(()=>toast('info','Completado','Forecast actualizado con nuevos supuestos'),1500)}
        function generarInformeCovenants(){toast('info','Generando','Preparando informe de covenants...');setTimeout(()=>{toast('success','Completado','informe-covenants-q2-2024.pdf');navigate('board')},1500)}
        function generarBoardPack(){openModal(icons.briefcase+' Board Pack Generado','<div class="mb-16"><div class="alert-item success"><div class="alert-icon">'+icons.check+'</div><div class="alert-content"><div class="alert-title">Board Pack Junio 2024 - Listo</div><div class="alert-desc">5 secciones generadas con datos actualizados</div></div></div></div><div style="background:var(--bg-main);padding:16px;border-radius:8px;margin-bottom:16px"><h4 class="mb-8">Contenido del Pack:</h4><ul style="margin:0;padding-left:20px;line-height:2"><li>1. Resumen Ejecutivo</li><li>2. Liquidez & Forecast 13S</li><li>3. Working Capital</li><li>4. Deuda & Covenants</li><li>5. Riesgo Clientes</li></ul></div>','<button class="btn btn-ghost" onclick="closeModal();preguntarBot(\'Explica el board pack generado\')">'+icons.sparkles+' Enviar a Bot CFO</button><button class="btn btn-secondary" onclick="closeModal();toast(\'success\',\'Copiado\',\'Resumen copiado al portapapeles\')">'+icons.copy+' Copiar</button><button class="btn btn-primary" onclick="closeModal();toast(\'success\',\'Descargando\',\'board-pack-jun-2024.pdf\')">'+icons.download+' Descargar PDF</button>','sm')}
        function copiarResumenBoard(){const texto='RESUMEN EJECUTIVO - JUNIO 2024\n\nLiquidez: '+fmt(kpis.cajaHoy)+' (+3.2%)\nForecast S13: '+fmt(kpis.forecast13s)+'\nDSO: 42 días | DPO: 35 días\nCovenants: 4/4 OK\nNet Debt/EBITDA: 1.8x\n\nRiesgos: Consultores Estratégicos (score 55)';navigator.clipboard.writeText(texto).then(()=>toast('success','Copiado','Resumen copiado al portapapeles'))}
        // INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded',()=>{document.getElementById('logoIcon').innerHTML=icons.chartLine;document.getElementById('toggleBtn').innerHTML=icons.menu;document.getElementById('notifBtn').innerHTML=icons.bell;document.getElementById('modalClose').innerHTML=icons.close;const savedTheme=localStorage.getItem('geacfo_theme')||'light';setTheme(savedTheme);renderSidebar();navigate('cockpit');setTimeout(()=>document.getElementById('loading').classList.add('hidden'),500)});
    </script>
</body>
